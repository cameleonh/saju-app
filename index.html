    <title>결 | 사주를 읽는 투명한 방법</title>
    <style>
      :root {
        --ink-950: #f5eee2;
        --ink-800: #d7cfc4;
        --ink-600: #a9a3ae;
        --ink-400: #7d7b8e;
        --paper-50: #faf3e7;
        --paper-100: #eee4d4;
        --paper-200: #d9cdbb;
        --paper-300: #bcae9b;
        --vermilion-600: #b55f4b;
        --vermilion-100: #f3dfd3;
        --jade-600: #718d82;
        --jade-100: #e1ebe2;
        --amber-600: #b48b4e;
        --amber-100: #f2e5c9;
        --sky-600: #8589ae;
        --sky-100: #e6e3ee;
        --gold-500: #d3ad5c;
        --moon-300: #f5e5b4;
        --night-950: #14162a;
        --night-900: #1c1e35;
        --night-800: #252842;
        --shadow: 0 18px 42px rgba(6, 8, 22, 0.28);
        --radius-panel: 16px;
        --radius-card: 10px;
        --radius-control: 8px;
        --container: 1180px;

        --font-serif: "Noto Serif KR", "Noto Serif CJK KR", "Noto Sans KR", "AppleMyungjo", "Nanum Myeongjo", Batang, "Nanum Myeongjo", "UnBatang", "Droid Sans Fallback", serif;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { background: var(--night-950); scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink-950);
        background-color: var(--night-950);
        background-image: radial-gradient(circle at 84% 2%, rgba(211, 173, 92, 0.2), transparent 18rem), radial-gradient(circle at 12% 32%, rgba(83, 89, 139, 0.18), transparent 22rem);
        font-family: var(--font-sans);
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
        outline: 3px solid var(--vermilion-600);

      }
      a { color: inherit; }
      h1, h2, h3, p { margin: 0; }
      h1, h2, h3 { text-wrap: balance; word-break: keep-all; }
      p { max-width: 65ch; }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(216, 196, 155, 0.24);
        background: rgba(20, 22, 42, 0.92);
        backdrop-filter: blur(12px);
      }
      .topbar-inner, .container { width: min(var(--container), calc(100% - 40px)); margin: 0 auto; }
      .topbar-inner { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; letter-spacing: -0.03em; }
      .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: var(--moon-300); background: var(--night-900); border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(240,223,173,.42), 0 4px 14px rgba(5,7,20,.3); }
      .brand-mark svg { width: 22px; height: 22px; }
      .brand-copy { display: grid; line-height: 1.05; font-family: var(--font-serif); }
      .brand-copy small { margin-top: 4px; color: var(--ink-600); font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
      .topnav { display: flex; align-items: center; gap: 8px; }
      .topnav button { min-height: 44px; padding: 8px 12px; color: var(--ink-600); background: transparent; border: 0; border-radius: 9px; font-size: 15px; font-weight: 700; }
      .topnav button:hover { color: var(--moon-300); background: rgba(245, 229, 180, 0.1); }

      main { padding: 46px 0 92px; }
      .eyebrow { color: var(--sky-600); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
      .muted { color: var(--ink-600); }
      .tiny { color: var(--ink-400); font-size: 12px; }
      .display { max-width: 13ch; margin-top: 14px; font-family: var(--font-serif); font-size: clamp(1.9rem, 1.3rem + 2.2vw, 3rem); font-weight: 600; line-height: 1.3; letter-spacing: -0.04em; }
      .lead-copy { margin-top: 18px; color: var(--ink-600); font-size: 17px; line-height: 1.7; }

      .intro-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 0.86fr); align-items: stretch; gap: 36px; }
      .intro-copy { display: flex; flex-direction: column; justify-content: center; min-height: 420px; }
      .intro-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      .mode-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 26px; }
      .mode-card { position: relative; min-height: 112px; padding: 16px; text-align: left; color: #d7cfc4; background: rgba(37, 40, 66, 0.78); border: 1px solid rgba(220, 205, 177, 0.28); border-radius: var(--radius-card); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
      .mode-card strong { display: block; color: #f5eee2; font-size: 15px; }
      .mode-card small { display: block; margin-top: 6px; color: #a9a3ae; font-size: 15px; line-height: 1.6; }
      .mode-card[aria-pressed="true"] { color: #2c2936; background: var(--moon-300); border-color: var(--moon-300); box-shadow: 0 12px 24px rgba(5, 7, 20, 0.28); }
      .mode-card[aria-pressed="true"] strong { color: #2c2936; }
      .mode-card[aria-pressed="true"] small { color: #665e63; }
      .mode-glyph { width: 28px; height: 20px; display: flex; align-items: center; gap: 4px; margin-bottom: 12px; color: var(--gold-500); }
      .mode-glyph i { width: 11px; height: 11px; display: block; border: 1px solid currentColor; border-radius: 50%; }
      .mode-glyph i:last-child { margin-left: -1px; color: var(--gold-500); }
      .form-section { padding: 18px; background: var(--paper-100); border: 1px solid var(--paper-200); border-radius: var(--radius-card); }
      .form-section + .form-section { margin-top: 18px; }
      .form-section-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .form-section-heading h2 { font-size: 20px; letter-spacing: -0.03em; }
      .form-section-heading p { margin-top: 5px; color: var(--ink-600); font-size: 15px; line-height: 1.6; }
      .pair-label { display: inline-flex; align-items: center; gap: 6px; color: var(--sky-600); font-size: 15px; font-weight: 800; }
      .pair-label::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
      .pair-label.partner { color: var(--vermilion-600); }
      .couple-chart-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .couple-chart-pair .chart-aperture { box-shadow: none; }
      .couple-chart-pair .chart-aperture .pillar-row { gap: 6px; }
      .couple-chart-pair .pillar { padding: 11px 5px 12px; }
      .couple-chart-pair .pillar strong { font-size: 21px; }
      .relationship-note { padding: 14px 16px; color: var(--ink-800); background: var(--sky-100); border: 1px solid #c9d7ec; border-radius: var(--radius-card); }
      .relationship-note strong { display: block; color: var(--ink-950); font-size: 16px; }
      .relationship-note p { margin-top: 6px; color: var(--ink-600); font-size: 15px; line-height: 1.7; }
      .button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 16px; border: 1px solid transparent; border-radius: var(--radius-control); font-size: 15px; font-weight: 800; transition: transform 160ms ease, background 160ms ease, border-color 160ms ease; }
      .button:disabled { cursor: not-allowed; opacity: 0.48; transform: none; box-shadow: none; }
      .button:hover { transform: translateY(-1px); }
      .button.primary { color: #2b2734; background: var(--moon-300); box-shadow: 0 8px 18px rgba(5, 7, 20, 0.28); }
      .button.primary:hover { background: #fff0c8; }
      .button.secondary { color: #51495a; background: var(--paper-50); border-color: var(--paper-300); }
      .button.secondary:hover { border-color: var(--gold-500); background: #fffaf0; }
      .button.ghost { min-height: 40px; padding: 8px 11px; color: var(--ink-600); background: transparent; border-color: transparent; }
      .button.ghost:hover { color: var(--moon-300); background: rgba(245, 229, 180, 0.1); }
      .button.small { min-height: 44px; padding: 8px 12px; font-size: 15px; }
      .button.danger-link { width: 100%; margin-top: 18px; color: #8d3322; border-top: 1px solid var(--paper-200); border-radius: 0; }
      .button.danger-link:hover { color: #722719; background: var(--vermilion-100); }

      .aperture { --ink-950: #302c3a; --ink-800: #51495a; --ink-600: #726b70; --ink-400: #9b8f88; position: relative; overflow: hidden; color: var(--ink-950); background: var(--paper-50); border: 1px solid var(--paper-300); border-radius: var(--radius-panel); box-shadow: var(--shadow); }
      .aperture-preview { min-height: 420px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; }
      .aperture-preview::before, .aperture-preview::after { content: ""; position: absolute; pointer-events: none; }
      .aperture-preview::before { right: 28px; top: 48px; width: 148px; height: 148px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #fff7d1 0 9%, var(--moon-300) 10% 62%, #d2ae68 63% 100%); box-shadow: 0 0 0 12px rgba(240, 206, 127, 0.1), 0 0 44px rgba(232, 190, 96, 0.28); }
      .aperture-preview::after { right: -12px; bottom: 42px; width: 290px; height: 84px; background: #191a2e; clip-path: polygon(0 88%, 12% 70%, 24% 77%, 34% 47%, 44% 66%, 56% 40%, 69% 70%, 79% 52%, 90% 72%, 100% 48%, 100% 100%, 0 100%); opacity: .94; }
      .aperture-preview > * { position: relative; z-index: 1; }
      .aperture-preview .moon-scene { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
      .moon-scene .star { position: absolute; width: 3px; height: 3px; background: #f5e5b4; border-radius: 50%; box-shadow: 0 0 7px rgba(245,229,180,.8); }
      .moon-scene .star-a { top: 52px; right: 226px; }
      .moon-scene .star-b { top: 112px; right: 206px; width: 2px; height: 2px; }
      .moon-scene .star-c { top: 184px; right: 270px; width: 2px; height: 2px; }
      .moon-scene .roofline { position: absolute; right: 42px; bottom: 38px; width: 174px; height: 26px; border-top: 2px solid #3f3d56; transform: skewX(-22deg); opacity: .8; }
      .aperture-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
      .aperture-top .aperture-meta { flex: 0 0 auto; white-space: nowrap; }
      .aperture .eyebrow { color: #777693; }
      .aperture-meta { color: #847a76; font-size: 12px; }
      .aperture-title { max-width: 18ch; margin-top: 28px; font-family: var(--font-serif); font-size: 22px; font-weight: 600; line-height: 1.4; letter-spacing: -0.04em; }
      .pillar-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 24px; }
      .pillar { min-width: 0; padding: 14px 10px 15px; text-align: center; background: rgba(255,253,248,.72); border: 1px solid var(--paper-300); border-radius: 4px; box-shadow: inset 0 2px 0 rgba(184,154,99,.18); }
      .pillar small { display: block; color: var(--ink-600); font-size: 11px; }
      .pillar strong { display: block; margin-top: 7px; color: var(--ink-950); font-family: var(--font-serif); font-size: 25px; line-height: 1.05; }
      .pillar span { display: block; margin-top: 6px; color: var(--vermilion-600); font-size: 11px; font-weight: 700; }
      .pillar em { display: block; margin-top: 3px; color: var(--ink-600); font-size: 10px; font-style: normal; font-weight: 700; }
      .aperture-footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid var(--paper-200); color: var(--ink-600); font-size: 12px; }

      .section { margin-top: 58px; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
      .section-heading h2 { font-size: clamp(1.35rem, 1.15rem + 0.6vw, 1.8rem); line-height: 1.35; letter-spacing: -0.04em; }
      .section-heading p { color: var(--ink-600); font-size: 15px; }
      [id$="-title"] { scroll-margin-top: 92px; }
      [id$="-title"]:focus { outline: none; }
      [id$="-title"]:focus-visible { outline: 3px solid var(--vermilion-600); outline-offset: 5px; }
      .info-screen { max-width: 920px; margin: 0 auto; }
      .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
      .info-card { --ink-950: #302c3a; --ink-800: #51495a; --ink-600: #726b70; --ink-400: #9b8f88; padding: 22px; color: var(--ink-950); background: var(--paper-50); border: 1px solid var(--paper-300); border-radius: var(--radius-card); }
      .info-card h2 { font-size: 20px; }
      .info-card p, .info-card li { margin-top: 8px; color: var(--ink-600); font-size: 16px; line-height: 1.75; }
      .info-card ul { margin: 8px 0 0; padding-left: 1.25em; }
      .records-panel { --ink-950: #302c3a; --ink-800: #51495a; --ink-600: #726b70; --ink-400: #9b8f88; margin-top: 28px; padding: 24px; color: var(--ink-950); background: var(--paper-100); border: 1px solid var(--paper-300); border-radius: var(--radius-panel); }
      .records-heading { display: flex; align-items: start; justify-content: space-between; gap: 18px; }
      .records-heading h2 { font-size: 24px; }
      .records-heading p { margin-top: 6px; color: var(--ink-600); font-size: 15px; }
      .records-toolbar, .record-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .record-list { display: grid; gap: 12px; margin-top: 18px; }
      .record-card { padding: 18px; background: var(--paper-50); border: 1px solid var(--paper-300); border-radius: var(--radius-card); }
      .record-card-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
      .record-card h3 { font-size: 18px; }
      .record-card p { margin-top: 5px; color: var(--ink-600); font-size: 15px; line-height: 1.65; }
      .record-badge { flex: 0 0 auto; padding: 4px 8px; color: #51495a; background: var(--amber-100); border-radius: 999px; font-size: 13px; font-weight: 800; }
      .record-badge.ready { background: var(--jade-100); }
      .record-actions { margin-top: 14px; }
      .record-actions .button { flex: 0 1 auto; }
      .empty-records { margin-top: 18px; padding: 20px; color: var(--ink-600); text-align: center; background: rgba(255,255,255,.46); border: 1px dashed var(--paper-300); border-radius: var(--radius-card); }
      .panel, .form-section, .reading-card, .notice, .relationship-note, .chat-card { --ink-950: #302c3a; --ink-800: #51495a; --ink-600: #726b70; --ink-400: #9b8f88; color: var(--ink-950); }
      .panel { min-width: 0; padding: 26px; background: var(--paper-50); border: 1px solid var(--paper-300); border-radius: var(--radius-panel); box-shadow: 0 8px 20px rgba(6, 8, 22, 0.16); }
      .notice { padding: 20px 22px; background: var(--vermilion-100); border: 1px solid #efc7bc; border-left: 4px solid var(--vermilion-600); border-radius: var(--radius-card); }
      .notice.jade { background: var(--jade-100); border-color: #c8dfd8; border-left-color: var(--jade-600); }
      .notice.amber { background: var(--amber-100); border-color: #ead8ae; border-left-color: var(--amber-600); }
      .notice h3 { font-size: 18px; }
      .notice p { margin-top: 7px; color: var(--ink-600); font-size: 15px; line-height: 1.7; }
      .notice-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 14px; }
      .consent-toggle { display: flex; align-items: start; gap: 10px; padding: 14px; background: rgba(255, 255, 255, 0.42); border: 1px solid rgba(201, 86, 57, 0.18); border-radius: 12px; }
      .consent-toggle input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink-950); }
      .consent-toggle > span { color: var(--ink-800); font-size: 15px; line-height: 1.65; }
      .consent-toggle > span strong { display: block; color: var(--ink-950); }
      .notice-actions.consent-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .consent-list .consent-toggle { width: 100%; min-height: 78px; cursor: pointer; }
      .consent-list .consent-toggle input { width: 22px; height: 22px; flex: 0 0 22px; }
      .consent-list .consent-toggle:focus-within { border-color: var(--moon-500); box-shadow: 0 0 0 3px rgba(204, 172, 91, 0.2); }

      .flow-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
      .flow-step { color: var(--ink-600); font-size: 15px; font-weight: 800; }
      .step-track { display: flex; align-items: center; gap: 8px; }
      .step-dot { width: 9px; height: 9px; background: var(--paper-300); border-radius: 50%; }
      .step-dot.active { background: var(--vermilion-600); box-shadow: 0 0 0 4px var(--vermilion-100); }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 18px; }
      .lunar-input-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 8px; }
      .lunar-input-grid input { min-height: 44px; }
      .lunar-input-grid label { display: grid; gap: 4px; color: var(--ink-600); font-size: 11px; font-weight: 700; }
      .field { display: flex; flex-direction: column; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      .field label, .field legend { color: var(--ink-800); font-size: 15px; font-weight: 800; }
      .field legend { padding: 0; }
      .field small { color: var(--ink-600); font-size: 14px; line-height: 1.65; }
      .field input, .field select { width: 100%; min-height: 48px; padding: 10px 13px; color: var(--ink-950); background: #fff; border: 1px solid var(--paper-300); border-radius: var(--radius-control); }
      .field input:hover, .field select:hover { border-color: var(--ink-400); }
      .field input:disabled { color: var(--ink-400); background: var(--paper-100); }
      .place-search { padding-right: 42px !important; background-image: radial-gradient(circle, transparent 42%, var(--ink-600) 44% 54%, transparent 56%), linear-gradient(45deg, transparent 44%, var(--ink-600) 46% 54%, transparent 56%); background-position: right 19px top 15px, right 12px top 29px; background-repeat: no-repeat; background-size: 13px 13px, 9px 9px; }
      .place-match-panel { display: grid; gap: 8px; margin-top: 3px; padding: 12px; background: var(--paper-100); border: 1px solid var(--paper-300); border-radius: var(--radius-control); }
      .place-match-panel[hidden] { display: none; }
      .place-match-panel label { font-size: 14px; }
      .place-match-panel select { min-height: 50px; background: #fff; }
      .place-match-status { color: var(--ink-600); font-size: 14px; line-height: 1.55; }
      .segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .segmented.three { grid-template-columns: repeat(3, 1fr); }
      .segmented button { min-height: 48px; padding: 9px 10px; color: var(--ink-600); background: #fff; border: 1px solid var(--paper-300); border-radius: var(--radius-control); font-size: 15px; font-weight: 800; }
      .segmented button[aria-pressed="true"] { color: #fff; background: var(--ink-950); border-color: var(--ink-950); box-shadow: 0 4px 10px rgba(31, 42, 61, 0.12); }
      .segmented button:disabled { cursor: not-allowed; color: var(--ink-400); background: var(--paper-100); border-color: var(--paper-200); }
      .check-row { display: flex; align-items: start; gap: 10px; padding-top: 8px; }
      .check-row input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ink-950); }
      .check-row label { color: var(--ink-600); font-size: 15px; line-height: 1.65; }
      .form-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--paper-200); }
      .error { padding: 11px 13px; color: #8d3322; background: var(--vermilion-100); border-radius: 9px; font-size: 15px; line-height: 1.65; }

      .result-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .result-toolbar .toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .result-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr); gap: 18px; align-items: start; }
      .result-layout > *, .result-main, .result-side, .result-side > * { min-width: 0; }
      .result-main, .result-side { width: 100%; display: grid; gap: 18px; }
      .chart-aperture { padding: 26px; }
      .chart-aperture .aperture-title { margin-top: 12px; }
      .chart-aperture .pillar-row { margin-top: 30px; }

          }).join('')}</div>`;
        }

        function dataView() {
          return shell(`<section class="section info-screen" aria-labelledby="data-title"><div class="eyebrow">데이터 안내와 기록함</div><h1 id="data-title" class="display" tabindex="-1">내 정보는 어디에 저장되나요?</h1><p class="lead-copy">모든 풀이는 먼저 이 기기의 브라우저에 저장됩니다. 로그인한 성인이 본인 단일 명식을 저장할 때만 서울 리전의 계정 저장소를 사용합니다.</p><div class="info-grid"><article class="info-card"><h2>계정 저장 범위</h2><p>성인 본인의 생년월일, 출생 시각, 출생지와 계산 결과만 암호화 저장합니다. 커플·상대방·미성년 명식은 계정 저장소에 제출하지 않습니다. 음력 변환의 날짜·시각은 요청 처리 중에만 일시 사용합니다.</p></article><article class="info-card"><h2>학습·마케팅 없음</h2><p>명식과 입력값을 모델 학습, 광고 맞춤화 또는 마케팅에 사용하지 않습니다. 해당 선택 항목도 제공하지 않습니다.</p></article><article class="info-card"><h2>외부 생성형 AI 전송 없음</h2><p>질문 정리는 앱 안의 고정 규칙으로 만들며 외부 생성형 AI에 자동 전송하지 않습니다.</p></article><article class="info-card"><h2>삭제와 백업</h2><p>기록 삭제 시 운영 데이터는 즉시 삭제 절차에 들어가고, 관리형 데이터베이스 백업은 최대 7일 안에 만료됩니다. 인증·보안 로그는 최대 90일 보관합니다.</p></article></div><p><a href="/privacy.html">개인정보 처리방침</a> · <a href="/terms.html">이용약관</a></p><section class="records-panel" aria-labelledby="records-title"><div class="records-heading"><div><h2 id="records-title">${state.account.authenticated ? '계정과 이 기기의 저장 기록' : '이 기기의 저장 기록'}</h2><p>열기와 내보내기는 바로 실행되고, 삭제와 전체 삭제는 한 번 더 확인합니다.</p></div><div class="records-toolbar"><button class="button secondary small" data-action="records-refresh">새로고침</button><button class="button ghost small" data-action="records-clear" ${state.records.length ? '' : 'disabled'}>전체 기록 지우기</button></div></div>${recordListMarkup()}</section>${state.account.authenticated ? '<section class="notice amber" aria-labelledby="account-delete-title"><h2 id="account-delete-title">계정 탈퇴</h2><p>계정 탈퇴는 계정에 저장된 명식, 이 기기의 기록과 로그인 계정을 삭제합니다. 활성 데이터는 즉시 삭제하고 복구 백업은 최대 7일 안에 만료됩니다.</p><button class="button ghost danger-link" data-action="account-delete">계정과 모든 기록 삭제</button></section>' : ''}<div class="intro-actions"><button class="button primary" data-action="nav-home">새 풀이 시작 ${icon('arrow')}</button></div></section>`);
        }

        function birthFields(prefix, form, partner = false) {
          const id = (name) => `${prefix}-${name}`;
          const areaCount = BIRTH_PLACE_VALUES.length.toLocaleString('ko-KR');
          return `<div class="form-grid"><fieldset class="field full"><legend>달력 종류</legend><div class="segmented"><button type="button" data-field="calendar" data-owner="${prefix}" data-value="solar" aria-pressed="${form.calendar === 'solar'}">양력</button><button type="button" data-field="calendar" data-owner="${prefix}" data-value="lunar" aria-pressed="${form.calendar === 'lunar'}">음력 <span class="tiny">음력·윤달 지원</span></button></div><small>음력은 만세력 원천 데이터로 양력 날짜를 변환한 뒤 계산합니다. 원래 입력과 변환 결과를 함께 저장합니다.</small></fieldset><div class="field"><label for="${id('date')}">생년월일</label><input id="${id('date')}" name="${prefix}Date" type="date" min="1900-01-01" max="${new Date().toISOString().slice(0,10)}" value="${escapeHtml(form.date)}" required><small>양력은 1900년부터 오늘까지 입력할 수 있어요. 음력은 1900~2100년을 지원합니다.</small></div><div class="field"><label for="${id('time')}">출생 시각</label><input id="${id('time')}" name="${prefix}Time" type="time" value="${escapeHtml(form.time)}" ${form.unknownTime ? 'disabled' : ''}><div class="check-row"><input id="${id('unknown-time')}" name="${prefix}UnknownTime" type="checkbox" ${form.unknownTime ? 'checked' : ''}><label for="${id('unknown-time')}">정확한 시각을 몰라요. 시주는 계산하지 않습니다.</label></div></div><div class="field full"><label for="${id('place')}">출생한 동·읍·면·리</label><input class="place-search" id="${id('place')}" name="${prefix}Place" type="search" value="${escapeHtml(form.place)}" placeholder="예: 문현동, 역삼1동" autocomplete="off" enterkeyhint="search" aria-describedby="${id('place-help')}" required><small id="${id('place-help')}">동·읍·면 이름을 입력한 뒤 목록에서 골라 주세요. 행정안전부 ${ADMIN_AREA_DATA.version} 시행 기준 ${areaCount}곳을 제공하며, 계산 시각은 한국 표준시(Asia/Seoul)를 사용합니다.</small></div><fieldset class="field"><legend>전통 성별 입력값 <span class="tiny">선택</span></legend><div class="segmented three"><button type="button" data-field="sex" data-owner="${prefix}" data-value="unset" aria-pressed="${form.sex === 'unset'}">선택 안 함</button><button type="button" data-field="sex" data-owner="${prefix}" data-value="female" aria-pressed="${form.sex === 'female'}">여성</button><button type="button" data-field="sex" data-owner="${prefix}" data-value="male" aria-pressed="${form.sex === 'male'}">남성</button></div><small>일부 대운 방식에 쓰이는 계산 입력값이며 정체성을 판단하지 않습니다.</small></fieldset>${partner ? '' : '<div class="field full"><div class="check-row"><input id="same-person" name="samePerson" type="checkbox" ' + (form.samePerson ? 'checked' : '') + '><label for="same-person"><strong>이 정보는 제 출생 정보입니다</strong><br>다른 사람의 정보를 입력한다면 권한과 관계를 확인해야 합니다.</label></div></div>'}</div>`;
        }
        function inputView() {
          const f = state.form;
          const selfSection = `<section class="form-section"><div class="form-section-heading"><div><span class="pair-label">내 명식</span><h2>내 출생 정보</h2><p>비교의 기준이 되는 첫 번째 명식입니다.</p></div></div>${birthFields('self', f)}</section>`;
          const coupleSection = `<section class="form-section"><div class="form-section-heading"><div><span class="pair-label partner">상대 명식</span><h2>상대방 출생 정보</h2><p>커플이 될 사람 또는 지금의 상대 정보를 별도로 입력합니다.</p></div></div><fieldset class="field" style="margin-bottom:18px"><legend>현재 관계</legend><div class="segmented three"><button type="button" data-relationship="getting-to-know" aria-pressed="${state.relationshipType === 'getting-to-know'}">알아가는 사이</button><button type="button" data-relationship="dating" aria-pressed="${state.relationshipType === 'dating'}">현재 연인</button><button type="button" data-relationship="partner" aria-pressed="${state.relationshipType === 'partner'}">배우자·동반자</button></div></fieldset>${birthFields('partner', state.partnerForm, true)}</section>`;
          const annualField = state.mode === 'single' ? `<section class="form-section annual-year-input"><div class="form-section-heading"><div><span class="pair-label">연운 카드</span><h2>살펴볼 연도</h2><p>해당 연도의 입춘부터 다음 입춘 직전까지 계산합니다.</p></div></div><div class="field"><label for="target-year">연운 연도</label><input id="target-year" name="targetYear" type="number" min="2024" max="2026" value="${escapeHtml(state.targetYear)}" required><small>검토된 2024~2026 고정값과 자평명리 파생 v1 프로필로 8장 카드와 별도 월별 흐름을 만듭니다.</small></div></section>` : '';
          return shell(`<section class="section" aria-labelledby="input-title"><div class="section-heading"><div><div class="eyebrow">${state.mode === 'couple' ? '두 사람 입력' : '출생 정보와 연운'}</div><h1 id="input-title">${state.mode === 'couple' ? '두 사람의 출생 정보를 입력해 주세요' : '출생 정보와 살펴볼 연도를 입력해 주세요'}</h1></div><p>입력한 정보는 계산 정책과 함께 기록됩니다.</p></div><div class="panel"><div class="flow-header"><span class="flow-step">${state.mode === 'couple' ? '두 사람의 출생 정보는 서로 구분해 기록합니다' : '원본 입력·명식·연운 사실·카드를 서로 구분해 기록합니다'}</span><div class="step-track" aria-label="진행 단계"><span class="step-dot active"></span><span class="step-dot"></span><span class="step-dot"></span></div></div><form id="birth-form" novalidate>${selfSection}${annualField}${state.mode === 'couple' ? coupleSection : ''}<div class="form-footer">${state.error ? `<div class="error" role="alert">${escapeHtml(state.error)}</div>` : '<span class="tiny">계산 후에도 원래 입력과 계산 정책을 함께 확인할 수 있어요.</span>'}<button class="button primary" type="submit">${state.mode === 'couple' ? '두 사람의 사주풀이 시작하기' : '명식과 연운 카드 만들기'} ${icon('arrow')}</button></div></form></div></section>`);
        }

        function coupleResultView() {
          const chart = state.chart;
          const max = Math.max(...Object.values(chart.elementCounts), 1);
          const bars = Object.entries(chart.elementCounts).map(([key, value]) => `<div><div class="bar-head"><span>${ELEMENT_LABELS[key]}</span><strong class="mono">${value}</strong></div><div class="bar-track"><div class="bar-fill ${({목:'wood',화:'fire',토:'earth',금:'metal',수:'water'})[key]}" style="width:${Math.max(8, (value / max) * 100)}%"></div></div></div>`).join('');
          const reading = readingMarkup(chart.reading);
          const messages = state.messages.map((message) => `<div class="bubble ${message.role === 'user' ? 'user' : ''}">${escapeHtml(message.text)}</div>`).join('');
          const sheet = (label, input, data) => `<section class="aperture chart-aperture" aria-label="${label} 명식"><div class="aperture-top"><div><span class="pair-label ${label === '상대' ? 'partner' : ''}">${label} 명식</span><h2 class="aperture-title">${formatKoreanDate(input.date)}</h2></div><span class="aperture-meta mono">${chart.policy.id}</span></div><div class="pillar-row">${pillarMarkup(data.pillars)}</div><dl class="method-details"><div><dt>출생지</dt><dd>${escapeHtml(input.place)} · Asia/Seoul</dd></div><div><dt>입력 상태</dt><dd>${input.unknownTime ? '시각 미상' : escapeHtml(input.time)}</dd></div></dl></section>`;
          return shell(`<section class="section" aria-labelledby="result-title"><div class="result-toolbar"><div><div class="eyebrow">두 명식 확인</div><h1 id="result-title">두 사람의 명식을 나란히 확인하세요</h1></div><div class="toolbar-actions"><button class="button ghost small" data-action="edit">${icon('back')} 다시 입력</button><button class="button secondary small" data-action="copy">${icon('copy')} 구조 복사</button><button class="button secondary small" data-action="export">${icon('download')} 내보내기</button></div></div><div class="result-layout"><div class="result-main"><div class="relationship-note"><strong>${relationshipLabel(chart.relationshipType)} · 비교는 판정이 아니라 관찰입니다</strong><p>두 사람의 차이를 우열이나 점수로 만들지 않고, 대화할 장면을 찾는 참고 자료로 보여드려요.</p></div><div class="couple-chart-pair">${sheet('내', chart.input, chart.self)}${sheet('상대', chart.partnerInput, chart.partner)}</div>${chart.warnings.length ? warningMarkup(chart.warnings) : '<div class="notice jade"><h3>주요 경계 경고가 없습니다</h3><p>현재 입력은 검토된 계산 경계에서 충분히 떨어져 있습니다.</p></div>'}<section class="panel reading-report"><div class="section-heading"><div><div class="eyebrow">근거를 따라 비교하기</div><h2>두 명식의 결을 따라 읽기</h2></div><p>각 장을 펼치고 근거를 확인하세요.</p></div>${reading}</section><section class="panel chat-card"><div class="side-title"><div><div class="eyebrow">규칙 기반 질문 정리</div><h2>관계 질문을 구체적으로 정리하기</h2></div><span class="tiny">AI 예측 아님 · 결정을 대신하지 않음</span></div><div class="chat-log" aria-live="polite">${messages || '<div class="bubble">계산된 차트 사실을 바탕으로 생각할 질문을 정리합니다. 두 분이 자주 부딪히는 장면을 짧게 적어보세요.</div>'}</div><form class="chat-form" id="chat-form"><input name="question" aria-label="관계의 장면 질문하기" placeholder="예: 서로 다른 속도를 어떻게 관찰할까요?" required><button class="button primary" type="submit">질문 정리하기 ${icon('arrow')}</button></form></section></div><aside class="result-side"><section class="panel"><div class="side-title"><h3>두 명식 오행 합산</h3><span class="tiny">참고값</span></div><div class="bar-list">${bars}</div><div class="legend-row"><span class="legend-item"><i class="legend-dot wood"></i>목</span><span class="legend-item"><i class="legend-dot fire"></i>화</span><span class="legend-item"><i class="legend-dot earth"></i>토</span><span class="legend-item"><i class="legend-dot metal"></i>금</span><span class="legend-item"><i class="legend-dot water"></i>수</span></div></section><section class="panel"><div class="side-title"><h3>계산 원칙</h3><button class="button ghost small" data-action="method">${state.detailNotice ? '접기' : '열기'} ${icon('chevron')}</button></div><p class="muted" style="margin-top:12px;font-size:13px">${chart.policy.name}. 두 사람의 원본 입력은 서로 다른 주체로 기록합니다.</p>${state.detailNotice ? `<div class="fact-detail"><strong>출처와 한계</strong><br>${chart.policy.source}. 커플 비교는 관계 결과를 확정하지 않습니다.</div>` : ''}</section></aside></div></section>`);
        }

        function resultView() {
          const chart = state.chart;
          if (chart?.mode === 'couple') return coupleResultView();
          const max = Math.max(...Object.values(chart.elementCounts), 1);
          const bars = Object.entries(chart.elementCounts).map(([key, value]) => `<div><div class="bar-head"><span>${ELEMENT_LABELS[key]}</span><strong class="mono">${value}</strong></div><div class="bar-track"><div class="bar-fill ${({목:'wood',화:'fire',토:'earth',금:'metal',수:'water'})[key]}" style="width:${Math.max(8, (value / max) * 100)}%"></div></div></div>`).join('');
          const reading = readingMarkup(chart.reading);
          const messages = state.messages.map((message) => `<div class="bubble ${message.role === 'user' ? 'user' : ''}">${escapeHtml(message.text)}</div>`).join('');
          const annualMarkup = renderAnnualReading(state.annual, { activeIndex: state.annualCardIndex, activeFact: state.annualFact, error: state.annualError });
          const currentAge = chart.input.date ? new Date().getFullYear() - Number(chart.input.date.split('-')[0]) : 0;
          const daewoonMarkup = chart.daewoon ? `<section class="panel" aria-labelledby="daewoon-heading"><div class="section-heading"><div><div class="eyebrow">대운 (大運)</div><h2 id="daewoon-heading">10년 주기 운의 흐름</h2></div><span class="tiny mono">${chart.daewoon.policy.id}</span></div><p class="muted" style="margin-bottom:16px;font-size:13px">${chart.daewoon.direction === 'forward' ? '순행' : '역행'} · 시작 나이 ${chart.daewoon.startAge}세 · ${chart.daewoon.boundaryTerm} 기준</p><div class="daewoon-timeline">${chart.daewoon.cycles.map((c) => { const isCurrent = c === chart.daewoon.cycles.find((cc, i) => { const next = chart.daewoon.cycles[i + 1]; return currentAge >= cc.startAge && (!next || currentAge < next.startAge); }); return `<div class="daewoon-cycle${isCurrent ? ' current' : ''}"><div class="daewoon-pillar">${c.pillar}</div><div class="daewoon-age">${c.startAge}세</div><div class="daewoon-year">${c.startYear}년~</div>${isCurrent ? '<span class="daewoon-now">현재</span>' : ''}</div>`; }).join('')}</div><p class="muted" style="margin-top:12px;font-size:12px">대운의 방향과 시작 나이는 ${chart.daewoon.policy.id} 정책으로 계산합니다. 의미론적 해석(용신·격국·신강신약)은 지원하지 않습니다.</p></section>` : '';
          return shell(`<section class="section" aria-labelledby="result-title"><div class="result-toolbar"><div><div class="eyebrow">명식과 연운 확인</div><h1 id="result-title">계산 사실과 연운 카드의 근거를 확인하세요</h1></div><div class="toolbar-actions"><button class="button ghost small" data-action="edit">${icon('back')} 다시 입력</button><button class="button secondary small" data-action="copy">${icon('copy')} 구조 복사</button><button class="button secondary small" data-action="export">${icon('download')} 내보내기</button></div></div><div class="result-layout"><div class="result-main"><section class="aperture chart-aperture" aria-labelledby="chart-summary"><div class="aperture-top"><div><div class="eyebrow">계산한 명식</div><h2 id="chart-summary" class="aperture-title">${formatKoreanDate(chart.input.date)}의 네 기둥</h2></div><span class="aperture-meta mono">${chart.policy.id}</span></div><div class="pillar-row">${pillarMarkup(chart.pillars)}</div><dl class="method-details"><div><dt>출생지</dt><dd>${escapeHtml(chart.input.place)} · Asia/Seoul</dd></div><div><dt>입력 상태</dt><dd>${chart.input.unknownTime ? '시각 미상' : escapeHtml(chart.input.time)}</dd></div></dl></section>${chart.warnings.length ? warningMarkup(chart.warnings) : '<div class="notice jade"><h3>주요 경계 경고가 없습니다</h3><p>현재 입력은 검토된 계산 경계에서 충분히 떨어져 있습니다. 계산 정책은 언제든 다시 열어볼 수 있어요.</p></div>'}${daewoonMarkup}${annualMarkup}<section class="panel reading-report"><div class="section-heading"><div><div class="eyebrow">근거를 따라 읽기</div><h2>명식의 결을 따라 읽기</h2></div><p>각 장을 펼치고 근거를 확인하세요.</p></div>${reading}</section><section class="panel chat-card"><div class="side-title"><div><div class="eyebrow">규칙 기반 질문 정리</div><h2>궁금한 장면을 질문으로 정리하기</h2></div><span class="tiny">AI 예측 아님 · 결정을 대신하지 않음</span></div><div class="chat-log" aria-live="polite">${messages || '<div class="bubble">계산된 차트 사실을 바탕으로 생각할 질문을 정리합니다. 궁금한 장면을 짧게 적어보세요.</div>'}</div><form class="chat-form" id="chat-form"><input name="question" aria-label="생각을 정리할 질문 입력" placeholder="예: 이직 전에 확인할 조건은 무엇인가요?" required><button class="button primary" type="submit">질문 정리하기 ${icon('arrow')}</button></form></section></div><aside class="result-side"><section class="panel"><div class="side-title"><h3>오행 분포</h3><span class="tiny">참고값</span></div><div class="bar-list">${bars}</div><div class="legend-row"><span class="legend-item"><i class="legend-dot wood"></i>목</span><span class="legend-item"><i class="legend-dot fire"></i>화</span><span class="legend-item"><i class="legend-dot earth"></i>토</span><span class="legend-item"><i class="legend-dot metal"></i>금</span><span class="legend-item"><i class="legend-dot water"></i>수</span></div></section><section class="panel"><div class="side-title"><h3>계산 원칙</h3><button class="button ghost small" data-action="method">${state.detailNotice ? '접기' : '열기'} ${icon('chevron')}</button></div><p class="muted" style="margin-top:12px;font-size:13px">${chart.policy.name}. 원본 입력과 계산용 값은 분리해 기록합니다.</p>${state.detailNotice ? `<div class="fact-detail"><strong>출처와 한계</strong><br>${chart.policy.source}. 연운은 별도 정책과 프로필 버전으로 계산하며 격국·용신·조후를 포함하지 않습니다.</div>` : ''}</section></aside></div></section>`);
        }

        function render() {
          const views = { intro: introView, input: inputView, result: resultView, method: methodView, data: dataView };
          const content = (views[state.screen] || introView)();
          document.getElementById('app').innerHTML = content;
          enhanceConsentAndCoupleInput();
          enhanceCalendarFields();
          enhanceBirthPlaceFields();
          enhanceResultView();
          document.querySelectorAll('#page-title, #notice-title, #input-title, #result-title, #method-title, #data-title').forEach((heading) => heading.setAttribute('tabindex', '-1'));
          bindEvents();

        function enhanceConsentAndCoupleInput() {
          if (state.screen !== 'input' || state.mode !== 'couple') return;
          const form = document.getElementById('birth-form');
          const sections = form ? [...form.querySelectorAll(':scope > .form-section')] : [];
          if (form && sections.length === 2) {
            const pair = document.createElement('div');
            pair.className = 'couple-input-pair';
            form.insertBefore(pair, sections[0]);
            sections.forEach((section) => pair.append(section));
          }
        }

        function enhanceResultView() {
          if (state.screen !== 'result') return;
          document.querySelector('main > .section')?.classList.toggle('reading-size-large', state.largeText);
          const toolbar = document.querySelector('.result-toolbar .toolbar-actions');
          toolbar?.insertAdjacentHTML('afterbegin', `<button class="button secondary small" data-action="text-size" aria-pressed="${state.largeText}">${state.largeText ? '기본 글자' : '글자 크게'}</button>`);

          const sidePanels = [...document.querySelectorAll('.result-side > .panel')];
          const methodPanel = sidePanels.find((panel) => panel.querySelector('h3')?.textContent.trim() === '계산 원칙');

            methodPanel.id = 'method-panel';
            if (state.currentRecordId) methodPanel.insertAdjacentHTML('beforeend', `<button class="button ghost danger-link small" data-action="record-delete" data-record-id="${escapeHtml(state.currentRecordId)}">이 저장 기록 지우기</button>`);
          }
        }

        function enhanceBirthPlaceFields() {
          if (state.screen !== 'input') return;
          const areaCount = BIRTH_PLACE_VALUES.length.toLocaleString('ko-KR');
          ['self', 'partner'].forEach((prefix) => {
            const input = document.getElementById(`${prefix}-place`);
            if (!input) return;
            const helper = document.getElementById(`${prefix}-place-help`);
            const panelId = `${prefix}-place-panel`;
            input.removeAttribute('list');
            input.setAttribute('aria-controls', panelId);
            input.setAttribute('aria-describedby', `${prefix}-place-help ${prefix}-place-status`);
            input.insertAdjacentHTML('afterend', `<div class="place-match-panel" id="${panelId}" role="group" aria-labelledby="${prefix}-place-result-label" hidden><label id="${prefix}-place-result-label" for="${prefix}-place-select">검색 결과에서 출생지를 골라 주세요</label><select id="${prefix}-place-select"><option value="">출생지를 선택해 주세요</option></select><small class="place-match-status" id="${prefix}-place-status" role="status" aria-live="polite" aria-atomic="true"></small></div>`);
            if (state.birthPlaceStatus !== 'ready') {
              input.disabled = true;
              if (helper) helper.textContent = state.birthPlaceStatus === 'error' ? (state.birthPlaceError || '출생지 목록을 불러오지 못했습니다.') : '전국 출생지 목록을 불러오는 중입니다.';
              if (state.birthPlaceStatus === 'error') document.getElementById(panelId)?.insertAdjacentHTML('afterend', '<button class="button secondary small" type="button" data-action="birthplace-retry">출생지 목록 다시 불러오기</button>');
              return;
            }
            input.disabled = false;
            if (helper) helper.textContent = `동네 이름을 입력하면 아래에 지역 목록이 나옵니다. 시·군·구를 확인해 골라 주세요. 행정안전부 ${BIRTH_PLACE_DATA.version} 기준 ${areaCount}곳입니다.`;
          });
        }

        function enhanceCalendarFields() {
          [['self', state.form], ['partner', state.partnerForm]].forEach(([prefix, form]) => {
            const dateInput = document.getElementById(`${prefix}-date`);
            if (!dateInput) return;
            const existing = document.getElementById(`${prefix}-lunar-fields`);
            if (form.calendar === 'lunar') {
              dateInput.hidden = true;
              dateInput.required = false;
              if (!existing) dateInput.insertAdjacentHTML('afterend', `<div id="${prefix}-lunar-fields" class="lunar-input-grid"><label>년<input type="number" name="${prefix}LunarYear" min="1900" max="2100" value="${escapeHtml(form.lunarYear)}" required></label><label>월<input type="number" name="${prefix}LunarMonth" min="1" max="12" value="${escapeHtml(form.lunarMonth)}" required></label><label>일<input type="number" name="${prefix}LunarDay" min="1" max="30" value="${escapeHtml(form.lunarDay)}" required></label></div><div class="check-row"><input id="${prefix}-leap-month" name="${prefix}LeapMonth" type="checkbox" ${form.leapMonth ? 'checked' : ''}><label for="${prefix}-leap-month">윤달</label></div>`);
            } else {
              dateInput.hidden = false;
              dateInput.required = true;
              existing?.remove();
              document.getElementById(`${prefix}-leap-month`)?.closest('.check-row')?.remove();
            }
          });
        }

        function bindEvents() {
          document.querySelectorAll('[data-action]').forEach((element) => element.addEventListener('click', onAction));
          document.querySelectorAll('[data-reading-key]').forEach((element) => element.addEventListener('toggle', () => {
            const key = element.dataset.readingKey;
            state.openReadings = element.open ? [...new Set([...state.openReadings, key])] : state.openReadings.filter((item) => item !== key);
          }));
          document.querySelectorAll('[data-field]').forEach((element) => element.addEventListener('click', () => { const target = element.dataset.owner === 'partner' ? state.partnerForm : state.form; target[element.dataset.field] = element.dataset.value; render(); }));
          document.querySelectorAll('[data-relationship]').forEach((element) => element.addEventListener('click', () => { state.relationshipType = element.dataset.relationship; render(); }));
          document.getElementById('service-consent-toggle')?.addEventListener('change', (event) => { state.serviceConsent = event.target.checked; state.error = ''; render(); });
          document.getElementById('training-toggle')?.addEventListener('change', (event) => { state.training = event.target.checked; state.error = ''; render(); });
          document.getElementById('self-unknown-time')?.addEventListener('change', (event) => { state.form.unknownTime = event.target.checked; render(); });
          document.getElementById('partner-unknown-time')?.addEventListener('change', (event) => { state.partnerForm.unknownTime = event.target.checked; render(); });
          ['self', 'partner'].forEach((prefix) => {
            const input = document.getElementById(`${prefix}-place`);
            const select = document.getElementById(`${prefix}-place-select`);
            input?.addEventListener('input', (event) => syncBirthPlaceDraft(event, prefix));
            input?.addEventListener('change', (event) => commitBirthPlace(event, prefix));
            input?.addEventListener('blur', (event) => commitBirthPlace(event, prefix));
            input?.addEventListener('focus', (event) => updateBirthPlaceSuggestions(event.currentTarget));
            select?.addEventListener('change', (event) => selectBirthPlace(event, prefix));
          });
          document.getElementById('same-person')?.addEventListener('change', (event) => { state.form.samePerson = event.target.checked; });
          document.getElementById('birth-form')?.addEventListener('submit', onBirthSubmit);
          document.getElementById('chat-form')?.addEventListener('submit', onChatSubmit);
        }

        function moveToStage(id) {
          window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
            const target = document.getElementById(id);
            if (!target) return;
            const previousScrollBehavior = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto';
            target.focus({ preventScroll: true });
            if (id === 'notice-title') target.scrollIntoView({ block: 'start' });
            else window.scrollTo(0, 0);
            document.documentElement.style.scrollBehavior = previousScrollBehavior;
          }));
        }

        function enterInputStage() {
          state.partnerForm.authorityVerified = state.mode === 'couple';
          state.currentRecordId = '';
          state.serverSubmissionId = '';
          state.screen = 'input';
          state.error = '';
          state.birthPlaceError = '';
          const catalogRequest = loadBirthPlaceData();
          render();
          moveToStage('input-title');
          catalogRequest.then(
            () => { if (state.screen === 'input') { render(); moveToStage('input-title'); } },
            () => { if (state.screen === 'input') { render(); moveToStage('input-title'); } },
          );
        }

        function openDataStage() {
          state.screen = 'data';
          state.error = '';
          state.recordsError = '';
          state.recordsLoading = true;
          render();
          moveToStage('data-title');
          loadRecords().finally(() => {
            if (state.screen !== 'data') return;
            render();
            moveToStage('data-title');
          });
        }

        async function syncAccount() {
          try {
            const response = await fetch('/v1/me', { headers: { accept: 'application/json' } });
            const result = response.ok ? await response.json() : { authenticated: false };
            state.account = { authenticated: result.authenticated === true, loading: false, available: response.ok && result.available !== false };
          } catch {
            state.account = { authenticated: false, loading: false, available: false };
          }
        }

        async function logoutAccount() {
          try { await fetch('/auth/logout', { method: 'POST', headers: { accept: 'application/json' } }); } catch {}
          state.account = { authenticated: false, loading: false, available: true };
          render();
        }

        async function deleteAccount() {
          if (!window.confirm('계정과 계정에 저장된 모든 명식을 삭제할까요? 이 기기의 저장 기록도 함께 지우며 되돌릴 수 없습니다.')) return;
          let response;
          try { response = await fetch('/v1/account', { method: 'DELETE' }); }
          catch { showToast('계정 삭제 요청을 보내지 못했습니다. 연결을 확인해 주세요.'); return; }
          if (response.status !== 204 && response.status !== 202) {
            showToast('계정을 삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.');
            return;
          }
          await annualStorage.clearAll();
          state.account = { authenticated: false, loading: false, available: true };
          state.records = [];
          state.currentRecordId = '';
          state.serverSubmissionId = '';
          state.screen = 'intro';
          render();
          showToast(response.status === 202 ? '저장 데이터는 삭제됐고 인증 계정 삭제를 마무리하고 있습니다.' : '계정과 저장 기록을 삭제했습니다.');
        }

        function onAction(event) {
          event.preventDefault();
          const action = event.currentTarget.dataset.action;
          if (action === 'mode') { state.mode = event.currentTarget.dataset.mode || 'single'; if (state.mode === 'couple') state.annual = null; state.error = ''; render(); }
          if (action === 'start') { if (!state.serviceConsent) { state.error = '서비스 저장 안내를 확인해야 출생 정보 입력을 시작할 수 있어요.'; state.detailNotice = true; render(); moveToStage('notice-title'); return; } enterInputStage(); }
          if (action === 'home' || action === 'nav-home') { state.screen = 'intro'; state.chart = null; state.annual = null; state.annualFact = ''; state.annualError = ''; state.currentRecordId = ''; state.serverSubmissionId = ''; state.serviceConsent = false; state.training = false; state.partnerForm.authorityVerified = false; state.error = ''; state.detailNotice = false; render(); moveToStage('page-title'); }
          if (action === 'nav-method' || action === 'method') { state.screen = 'method'; state.error = ''; render(); moveToStage('method-title'); }
          if (action === 'nav-data' || action === 'details') openDataStage();
          if (action === 'notice-details') { state.detailNotice = !state.detailNotice; render(); moveToStage('notice-title'); }
          if (action === 'edit') { enterInputStage(); }
          if (action === 'birthplace-retry') { state.birthPlaceError = ''; birthPlaceLoadPromise = null; const retry = loadBirthPlaceData(); render(); retry.then(() => { if (state.screen === 'input') render(); }, () => { if (state.screen === 'input') render(); }); }
          if (action === 'text-size') { state.largeText = !state.largeText; render(); }
          if (action === 'evidence') { state.activeFact = state.activeFact === event.currentTarget.dataset.fact ? '' : event.currentTarget.dataset.fact; render(); }
          if (action === 'annual-evidence') { state.annualFact = state.annualFact === event.currentTarget.dataset.fact ? '' : event.currentTarget.dataset.fact; render(); }
          if (action === 'annual-prev') { state.annualCardIndex = Math.max(0, state.annualCardIndex - 1); render(); document.querySelector(`[data-annual-card="${state.annualCardIndex}"]`)?.focus({ preventScroll: true }); }
          if (action === 'annual-next') { state.annualCardIndex = Math.min((state.annual?.cards.length || 1) - 1, state.annualCardIndex + 1); render(); document.querySelector(`[data-annual-card="${state.annualCardIndex}"]`)?.focus({ preventScroll: true }); }
          if (action === 'annual-export' && state.annual) downloadRecord(privacySafeAnnualExport(state.annual), `saju-annual-${state.annual.targetYear}.json`);
          if (action === 'annual-print') window.print();
          if (action === 'annual-card-png' && state.annual) downloadAnnualCardPng(state.annual, state.annualCardIndex);
          if (action === 'copy') copyChart();
          if (action === 'export') exportChart();
          if (action === 'records-refresh') openDataStage();
          if (action === 'records-clear') clearAllRecords();
          if (action === 'record-open') openSavedRecord(event.currentTarget.dataset.recordId);
          if (action === 'record-export') exportSavedRecord(event.currentTarget.dataset.recordId);
          if (action === 'record-delete') deleteSavedRecord(event.currentTarget.dataset.recordId);
          if (action === 'record-withdraw') withdrawTrainingUse(event.currentTarget.dataset.recordId);
          if (action === 'account-login') window.location.assign('/auth/login');
          if (action === 'account-logout') logoutAccount();
          if (action === 'account-delete') deleteAccount();
        }

        async function resolveBirthInput(form, prefix, current) {
          const source = { calendar: current.calendar, date: form.get(`${prefix}Date`) || null, time: form.get(`${prefix}Time`) || '12:00', unknownTime: form.get(`${prefix}UnknownTime`) === 'on', place: String(form.get(`${prefix}Place`) || '').trim(), lunarYear: form.get(`${prefix}LunarYear`), lunarMonth: form.get(`${prefix}LunarMonth`), lunarDay: form.get(`${prefix}LunarDay`), leapMonth: form.get(`${prefix}LeapMonth`) === 'on' };
          const placeResolution = resolveBirthPlace(source.place);
          if (placeResolution.status === 'ambiguous') throw new Error('같은 동네 이름이 여러 지역에 있어요. 아래 검색 결과에서 시·군·구를 확인해 골라 주세요.');
          if (placeResolution.status !== 'matched') throw new Error('동네 이름을 입력한 뒤 아래 검색 결과에서 출생지를 골라 주세요.');
          source.place = placeResolution.name;
          source.placeCode = placeResolution.code;
          const placeCode = placeResolution.code;
          if (current.calendar !== 'lunar') {
            const year = Number(String(source.date || '').slice(0, 4));
            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(source.date || '')) || year < 1900 || new Date(source.date) > new Date()) throw new Error('1900년부터 오늘까지의 생년월일을 입력해 주세요.');
            return { source, calculation: { ...current, calendar: 'solar', date: source.date, time: source.time, unknownTime: source.unknownTime, place: source.place, placeCode, sourceInput: source } };
          }
          const response = await fetch(CALENDAR_CONVERSION_PATH, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ calendar: 'lunar', year: source.lunarYear, month: source.lunarMonth, day: source.lunarDay, leapMonth: source.leapMonth, hour: source.unknownTime ? 12 : Number(source.time.split(':')[0]), minute: source.unknownTime ? 0 : Number(source.time.split(':')[1]), unknownTime: source.unknownTime }) });
          const converted = await response.json();
          if (!response.ok) throw new Error(converted.message || '음력 날짜를 양력으로 변환하지 못했습니다.');
          return { source, calculation: { ...current, calendar: 'solar', date: converted.date, time: converted.time, unknownTime: source.unknownTime, place: source.place, placeCode, sourceInput: source, calendarConversion: converted } };
        }

        async function onBirthSubmit(event) {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          try {
            state.annual = null;
            const self = await resolveBirthInput(form, 'self', state.form);
            state.form = { ...state.form, ...self.source };
            state.form.samePerson = form.get('samePerson') === 'on';
            if (!state.form.samePerson) throw new Error('내 명식은 본인 정보로 확인해 주세요.');
            if (state.mode === 'couple') {
              const partner = await resolveBirthInput(form, 'partner', state.partnerForm);
              state.partnerForm = { ...state.partnerForm, ...partner.source };
              if (!state.partnerForm.authorityVerified) throw new Error('커플 사주 시작 화면에서 정보 입력 권한을 먼저 확인해 주세요.');
              state.chart = calculateCoupleChart(self.calculation, partner.calculation, state.relationshipType);
            } else {
              state.chart = calculateChart(self.calculation);
              state.targetYear = Number(form.get('targetYear'));
              state.annual = await requestAnnualReading(state.chart, state.targetYear);
            }
          } catch (error) {
            state.error = error.message;
            render();
            return;
          }
          state.currentRecordId = newRecordId();
          state.serverSubmissionId = '';
          state.messages = [];
          state.activeFact = '';
          state.annualCardIndex = 0;
          state.annualFact = '';
          state.annualError = '';
          state.openReadings = [`${state.mode}-0`];
          state.screen = 'result';
          state.saveState = 'saving';
          render();
          persistRecord().then((result) => {
            state.saveState = result.durable === false ? 'outbox' : 'saved';
            render();
            if (state.screen === 'result') moveToStage('result-title');
          }).catch((error) => { state.saveState = 'outbox'; state.error = `저장 연결을 확인하지 못했어요. ${error.message}`; showToast(state.error); });
          moveToStage('result-title');
        }

        function onChatSubmit(event) {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const question = String(form.get('question') || '').trim();
          if (!question) return;
          state.messages.push({ role: 'user', text: question });
          state.messages.push({ role: 'assistant', text: buildReflectionAnswer(question, state.chart) });
          updateCurrentRecord().catch(() => { state.saveState = 'outbox'; render(); });
          render();
        }

        async function getStoredRecord(id) {
          return annualStorage.getRecord(id);
        }
        async function storeRecord(record) {
          return annualStorage.putRecord(record);
        }
        async function storePendingRecord(record, payload) {
          return annualStorage.putPendingRecord(record, payload);
        }
        async function updateOutboxRecord(record, purposeReceipts = record.purposeReceipts) {
          return annualStorage.updateOutboxRecord(record, purposeReceipts);
        }
        async function clearOutbox(id) {
          return annualStorage.clearOutbox(id);
        }
        async function deleteLocalRecord(id) {
          return annualStorage.deleteRecord(id);
        }
        async function loadRecords() {
          try {
            const localRecords = await annualStorage.listRecords();
            let cloudRecords = [];
            try { cloudRecords = await loadCloudRecords(); }
            catch { showToast('계정 기록은 불러오지 못했지만 이 기기의 기록은 사용할 수 있습니다.'); }
            const localSubmissionIds = new Set(localRecords.map((record) => record.serverSubmissionId).filter(Boolean));
            state.records = [...localRecords, ...cloudRecords.filter((record) => !localSubmissionIds.has(record.serverSubmissionId))];
            state.recordsError = '';
          } catch (error) {
            state.records = [];
            state.recordsError = `저장 기록을 불러오지 못했습니다. ${error.message}`;
          } finally {
            state.recordsLoading = false;
          }
          return state.records;
        }
        async function loadCloudRecords() {
          if (!state.account.authenticated) return [];
          const response = await fetch(INGESTION_PATH, { headers: { accept: 'application/json' } });
          if (response.status === 401) {
            state.account = { authenticated: false, loading: false };
            return [];
          }
          if (!response.ok) throw new Error(`계정 기록 응답 ${response.status}`);
          const result = await response.json();
          return (result.records || []).map((record) => ({
            id: `cloud-${record.submissionId}`,
            clientRequestId: record.clientRequestId,
            serverSubmissionId: record.submissionId,
            durable: true,
            remoteOnly: true,
            status: 'synced',
            mode: record.mode || 'single',
            birthDate: record.birthDate,
            place: record.place,
            createdAt: record.createdAt,
            updatedAt: record.createdAt,
          }));
        }
        async function materializeCloudRecord(record) {
          if (!record?.remoteOnly) return record;
          const response = await fetch(`${INGESTION_PATH}/${encodeURIComponent(record.serverSubmissionId)}`, { headers: { accept: 'application/json' } });
          if (!response.ok) throw new Error(`계정 기록 응답 ${response.status}`);
          const result = await response.json();
          const materialized = {
            id: result.clientRequestId || record.id,
            clientRequestId: result.clientRequestId,
            serverSubmissionId: result.submissionId,
            durable: true,
            remoteOnly: false,
            status: 'synced',
            mode: result.mode || 'single',
            chart: result.chart,
            annual: result.annual || null,
            messages: [],
            training: false,
            createdAt: result.createdAt,
            updatedAt: result.createdAt,
          };
          await storeRecord(materialized);
          return materialized;
        }
        async function persistRecord() {
          const clientRequestId = state.currentRecordId || newRecordId();
          state.currentRecordId = clientRequestId;
          const now = new Date().toISOString();
          state.training = false;
          const purposeReceipts = [{ receiptId: `receipt-service-${clientRequestId}`, purpose: 'service_storage', decision: 'accepted', disclosureVersion: 'service-storage.v2', recordedAt: now }];
          const partnerPurposeReceipts = state.mode === 'couple' ? [{ receiptId: `receipt-partner-local-${clientRequestId}`, purpose: 'service_storage', decision: 'accepted', disclosureVersion: 'local-device.v1', recordedAt: now, subjectRole: 'partner' }] : undefined;
          const birthInput = { calendar: state.chart.input.calendar, date: state.chart.input.date, time: state.chart.input.time, unknownTime: state.chart.input.unknownTime, place: state.chart.input.place, placeCode: state.chart.input.placeCode };
          const payload = { schemaVersion: 'submission.v1', clientRequestId, relationshipMode: state.mode, dataSubject: { relationship: 'self', authorityVerified: state.form.samePerson, minor: isMinorBirthDate(state.chart.input.date) }, birthInput, sourceBirthInput: state.chart.input.sourceInput || birthInput, chartResult: state.chart, purposeReceipts, ...annualSubmissionFields(state.annual) };
          if (state.mode === 'couple') payload.partnerSubject = { relationship: 'partner', authorityVerified: state.partnerForm.authorityVerified, minor: 'unknown' };
          if (state.mode === 'couple') { payload.partnerBirthInput = { calendar: state.chart.partnerInput.calendar, date: state.chart.partnerInput.date, time: state.chart.partnerInput.time, unknownTime: state.chart.partnerInput.unknownTime, place: state.chart.partnerInput.place, placeCode: state.chart.partnerInput.placeCode }; payload.partnerSourceBirthInput = state.chart.partnerInput.sourceInput || payload.partnerBirthInput; }
          if (state.mode === 'couple') payload.partnerPurposeReceipts = partnerPurposeReceipts;
          const shouldCloudSave = cloudSaveEligible();
          let record = { id: clientRequestId, clientRequestId, mode: state.mode, chart: state.chart, annual: state.annual, messages: state.messages, training: false, trainingEligible: false, serviceStorage: shouldCloudSave, purposeReceipts, partnerPurposeReceipts, serverSubmissionId: '', durable: false, status: shouldCloudSave ? 'pending-sync' : 'local-only', createdAt: state.chart.createdAt || now, updatedAt: now };
          if (!shouldCloudSave) {
            await storeRecord(record);
            await clearOutbox(record.id);
            return { durable: false, persistence: 'local-only' };
          }
          await storePendingRecord(record, payload);
          const response = await fetch(INGESTION_PATH, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
          if (response.status === 401 || response.status === 409) {
            state.account.authenticated = response.status !== 401 && state.account.authenticated;
            record = { ...record, status: 'local-only', updatedAt: new Date().toISOString() };
            await storeRecord(record);
            await clearOutbox(record.id);
            return { durable: false, persistence: 'local-only' };
          }
          if (!response.ok) throw new Error(`ingestion rejected: ${response.status}`);
          const result = await response.json();
          state.serverSubmissionId = result.submissionId || '';
          record = { ...record, serverSubmissionId: state.serverSubmissionId, durable: Boolean(result.durable), trainingEligible: false, status: result.durable ? 'synced' : 'local-only', updatedAt: new Date().toISOString() };
          await storeRecord(record);
          if (result.durable) await clearOutbox(record.id);
          else await updateOutboxRecord(record);
          return result;
        }
        async function updateCurrentRecord() {
          if (!state.currentRecordId) return null;
          const current = await getStoredRecord(state.currentRecordId);
          if (!current) return null;
          const updated = { ...current, chart: state.chart, annual: state.annual, messages: state.messages, training: state.training, updatedAt: new Date().toISOString() };
          await storeRecord(updated);
          await updateOutboxRecord(updated);
          return updated;
        }
        async function openSavedRecord(id) {
          let record = await getStoredRecord(id) || state.records.find((item) => item.id === id);
          try { record = await materializeCloudRecord(record); }
          catch (error) { state.recordsError = `계정 기록을 열지 못했습니다. ${error.message}`; if (state.screen === 'data') render(); return; }

          state.currentRecordId = record.id || id || newRecordId();
          state.serverSubmissionId = record.serverSubmissionId || '';
          state.chart = record.chart;
          state.annual = record.annual || null;
          state.targetYear = record.annual?.targetYear || state.targetYear;
          state.annualCardIndex = 0;
          state.annualFact = '';
          state.annualError = '';
          state.mode = record.mode || record.chart.mode || 'single';
          state.training = Boolean(record.training);
          state.serviceConsent = true;
          state.messages = Array.isArray(record.messages) ? record.messages : [];
          state.openReadings = [`${state.mode}-0`];
          state.saveState = record.durable && record.serverSubmissionId ? 'saved' : 'outbox';
          state.screen = 'result';
          state.error = '';
          render();
          moveToStage('result-title');
        }
        async function exportSavedRecord(id) {
          let record = await getStoredRecord(id) || state.records.find((item) => item.id === id);
          try { record = await materializeCloudRecord(record); }
          catch { showToast('계정 기록을 불러오지 못했습니다'); return; }

        }
        async function markRecordFailure(record, message) {
          const failed = { ...record, status: 'remote-delete-failed', lastError: message, updatedAt: new Date().toISOString() };
          await storeRecord(failed);
          await loadRecords();
          if (state.screen === 'data') { render(); moveToStage('data-title'); }
        }
        async function removeRecord(record) {
          if (record.serverSubmissionId && record.durable !== false) {
            try {
              const response = await fetch(`${INGESTION_PATH}/${encodeURIComponent(record.serverSubmissionId)}`, { method: 'DELETE' });
              if (!response.ok && response.status !== 404) { await markRecordFailure(record, `서버 삭제 응답 ${response.status}`); return false; }
            } catch (error) { await markRecordFailure(record, error.message); return false; }
          }
          await deleteLocalRecord(record.id);
          return true;
        }
        async function deleteSavedRecord(id, { confirmed = false } = {}) {
          const record = await getStoredRecord(id);
          if (!record) { showToast('이미 지워졌거나 찾을 수 없는 기록입니다'); return false; }
          if (!confirmed && !window.confirm('이 저장 기록을 지울까요? 이 작업은 되돌릴 수 없습니다.')) return false;
          const removed = await removeRecord(record);
          if (!removed) { showToast('서버 기록을 지우지 못했습니다. 기록함에서 다시 시도해 주세요.'); return false; }
          if (state.currentRecordId === record.id) { state.currentRecordId = ''; state.serverSubmissionId = ''; state.chart = null; state.messages = []; }
          await loadRecords();
          if (state.screen === 'result') openDataStage();
          else if (state.screen === 'data') { render(); moveToStage('data-title'); }
          showToast('선택한 기록을 지웠어요');
          return true;
        }
        async function clearAllRecords() {
          if (!state.records.length || !window.confirm('이 기기의 모든 저장 기록을 지울까요? 지운 기록은 되돌릴 수 없습니다.')) return;
          let failed = 0;
          for (const record of [...state.records]) if (!await removeRecord(record)) failed += 1;
          state.currentRecordId = '';
          state.serverSubmissionId = '';
          await loadRecords();
          if (state.screen === 'data') { render(); moveToStage('data-title'); }
          showToast(failed ? `${failed}개 서버 기록은 지우지 못해 다시 시도할 수 있도록 남겼어요` : '이 기기의 모든 기록을 지웠어요');
        }
        async function withdrawTrainingUse(id) {
          const record = await getStoredRecord(id);
          if (!record?.training) { showToast('철회할 학습 사용 기록이 없습니다'); return; }
          if (!window.confirm('제품 개선을 위한 학습 사용을 철회할까요? 서비스 기록과 풀이는 그대로 남습니다.')) return;
          const recordedAt = new Date().toISOString();
          if (record.serverSubmissionId && record.durable !== false) {
            try {
              const response = await fetch(`${INGESTION_PATH}/${encodeURIComponent(record.serverSubmissionId)}/training-withdrawal`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ recordedAt }) });
              if (!response.ok) { showToast(`서버에서 학습 사용을 철회하지 못했습니다 (${response.status})`); return; }
            } catch (error) { showToast('서버 연결을 확인하지 못해 학습 사용 상태를 바꾸지 않았어요'); return; }
          }
          const purposeReceipts = (record.purposeReceipts || []).map((receipt) => receipt.purpose === 'model_training' && ['accepted', 'granted'].includes(receipt.decision) ? { ...receipt, decision: 'withdrawn', withdrawnAt: recordedAt } : receipt);
          const updated = { ...record, training: false, trainingEligible: false, purposeReceipts, status: record.durable ? 'training-withdrawn' : 'local-only', updatedAt: recordedAt };
          await storeRecord(updated);
          await updateOutboxRecord(updated, purposeReceipts);
          if (state.currentRecordId === updated.id) state.training = false;
          await loadRecords();
          if (state.screen === 'data') { render(); moveToStage('data-title'); }
          showToast('제품 개선을 위한 학습 사용을 철회했어요. 서비스 기록은 남아 있습니다.');
        }
        async function copyChart() {
          const selfText = `${formatKoreanDate(state.chart.input.date)}\n${state.chart.pillars.map((item) => `${item.label} ${item.text}`).join(' · ')}`;
          const partnerText = state.chart.mode === 'couple' ? `\n상대 ${formatKoreanDate(state.chart.partnerInput.date)}\n${state.chart.partner.pillars.map((item) => `${item.label} ${item.text}`).join(' · ')}` : '';
          const text = `${selfText}${partnerText}\n계산 정책 ${state.chart.policy.id} · ${state.chart.policy.name}`;
          try { await navigator.clipboard.writeText(text); showToast('구조화된 차트를 복사했어요'); } catch (error) { showToast('복사하지 못했어요. 브라우저 권한을 확인해 주세요'); }
        }
        function downloadRecord(record, filename) {
          const blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
          URL.revokeObjectURL(link.href);
          showToast('기록 파일을 준비했어요');
        }
        function exportChart() {
          downloadRecord({ id: state.currentRecordId || null, chart: state.chart, annual: state.annual, messages: state.messages, training: state.training }, 'saju-chart.json');
        }
        async function downloadAnnualCardPng(annual, cardIndex) {
          const card = annual.cards[cardIndex];
          if (!card) return showToast('카드를 찾을 수 없어요');
          try { await document.fonts?.ready; } catch {}
          const W = 720, H = 1080;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          if (!ctx) return showToast('이 브라우저에서는 이미지를 만들 수 없어요');
          const grad = ctx.createLinearGradient(0, 0, W, H);
          grad.addColorStop(0, '#fffaef'); grad.addColorStop(1, '#f0e5cc');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = 'rgba(177,135,52,0.42)'; ctx.lineWidth = 2;
          ctx.strokeRect(24, 24, W - 48, H - 48);
          ctx.fillStyle = 'rgba(177,135,52,0.08)'; ctx.fillRect(24, 24, W - 48, 4);
          const x = 56, maxWidth = W - 112;
          let y = 80;
          ctx.fillStyle = '#8a7548'; ctx.font = '600 20px "Noto Sans KR", sans-serif';
          ctx.fillText(`${cardIndex + 1} / ${annual.cards.length} · ${card.cardType || ''}`, x, y);
          y += 34;
          ctx.fillStyle = '#1a1a1a'; ctx.font = '700 42px "Noto Serif KR", serif';
          y = drawCanvasTextBlock(ctx, card.title, { x, y, maxWidth, lineHeight: 52, maxLines: 2 });
          y += 14;
          ctx.fillStyle = '#4a4a4a'; ctx.font = '600 24px "Noto Sans KR", sans-serif';
          y = drawCanvasTextBlock(ctx, card.summary, { x, y, maxWidth, lineHeight: 34, maxLines: 3 });
          y = drawCanvasKeywordChips(ctx, card.keywords, x, y + 18, maxWidth);
          y += 10;
          ctx.fillStyle = '#3a3a3a'; ctx.font = '400 20px "Noto Sans KR", sans-serif';
          if (Array.isArray(card.bullets)) for (const bullet of card.bullets.slice(0, 3)) {
            y = drawCanvasTextBlock(ctx, `• ${bullet}`, { x, y, maxWidth, lineHeight: 29, maxLines: 2 });
            y += 7;
          }
          y += 9;
          if (card.action) {
            ctx.fillStyle = 'rgba(33,89,73,0.08)'; roundRect(ctx, 48, y, W - 96, 100, 12); ctx.fill();
            ctx.fillStyle = '#21594a'; ctx.font = '700 18px "Noto Sans KR", sans-serif'; ctx.fillText('해볼 일', 64, y + 28);
            ctx.fillStyle = '#3a3a3a'; ctx.font = '400 17px "Noto Sans KR", sans-serif';
            drawCanvasTextBlock(ctx, card.action, { x: 64, y: y + 50, maxWidth: W - 128, lineHeight: 23, maxLines: 2 });
            y += 114;
          }
          if (card.watch) {
            ctx.fillStyle = 'rgba(164,101,45,0.09)'; roundRect(ctx, 48, y, W - 96, 100, 12); ctx.fill();
            ctx.fillStyle = '#a4652d'; ctx.font = '700 18px "Noto Sans KR", sans-serif'; ctx.fillText('주의', 64, y + 28);
            ctx.fillStyle = '#3a3a3a'; ctx.font = '400 17px "Noto Sans KR", sans-serif';
            drawCanvasTextBlock(ctx, card.watch, { x: 64, y: y + 50, maxWidth: W - 128, lineHeight: 23, maxLines: 2 });
          }
          ctx.fillStyle = '#aaa'; ctx.font = '400 13px "Noto Sans KR", sans-serif';
          ctx.fillText(`saju.blog · ${annual.targetYear}년 ${annual.yearPillar} · ${annual.calculationPolicy?.id || ''}`, x, H - 48);
          canvas.toBlob((blob) => {
            if (!blob) return showToast('이미지 생성에 실패했어요');
            const link = document.createElement('a');
            const objectUrl = URL.createObjectURL(blob);
            link.href = objectUrl;
            link.download = `saju-annual-${annual.targetYear}-card-${cardIndex + 1}.png`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
            showToast('카드 이미지를 다운로드했어요');
          }, 'image/png');
        }
        function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
        function canvasTextLines(ctx, text, maxWidth, maxLines) {
          const lines = []; let line = '';
          for (const character of String(text || '')) {
            const candidate = line + character;
            if (line && ctx.measureText(candidate).width > maxWidth) { lines.push(line); line = character; }
            else line = candidate;
          }
          if (line) lines.push(line);
          if (lines.length <= maxLines) return lines;
          const visible = lines.slice(0, maxLines);
          let last = visible[maxLines - 1].replace(/\s+$/, '');
          while (last && ctx.measureText(`${last}…`).width > maxWidth) last = last.slice(0, -1);
          visible[maxLines - 1] = `${last}…`;
          return visible;
        }
        function drawCanvasTextBlock(ctx, text, { x, y, maxWidth, lineHeight, maxLines }) {
          const lines = canvasTextLines(ctx, text, maxWidth, maxLines);
          lines.forEach((line, index) => ctx.fillText(line, x, y + index * lineHeight));
          return y + lines.length * lineHeight;
        }
        function drawCanvasKeywordChips(ctx, keywords, x, y, maxWidth) {
          if (!Array.isArray(keywords) || !keywords.length) return y;
          ctx.font = '500 18px "Noto Sans KR", sans-serif';
          let chipX = x, chipY = y;
          for (const keyword of keywords.slice(0, 3)) {
            const label = canvasTextLines(ctx, keyword, maxWidth - 28, 1)[0] || '';
            const chipWidth = Math.min(maxWidth, ctx.measureText(label).width + 28);
            if (chipX > x && chipX + chipWidth > x + maxWidth) { chipX = x; chipY += 44; }
            ctx.fillStyle = 'rgba(177,135,52,0.15)'; roundRect(ctx, chipX, chipY, chipWidth, 34, 8); ctx.fill();
            ctx.fillStyle = '#6b5d3f'; ctx.fillText(label, chipX + 14, chipY + 23);
            chipX += chipWidth + 10;
          }
          return chipY + 44;
        }

        if (new URLSearchParams(window.location.search).has('demo')) { const demoInput = { ...state.form, place: '서울특별시 종로구 청운효자동', placeCode: '1111051500' }; state.chart = calculateChart(demoInput); state.screen = 'result'; state.saveState = 'outbox'; state.openReadings = ['single-0']; }
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') navigator.serviceWorker.register('service-worker.js').catch(() => {});
        render();
        syncAccount().finally(render);
      })();
