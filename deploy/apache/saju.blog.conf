<VirtualHost *:80>
    ServerName saju.blog
    ServerAlias www.saju.blog
    DocumentRoot /var/www/saju-app

    <Directory /var/www/saju-app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /v1/ http://127.0.0.1:4174/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:4174/v1/
    ProxyPass /health http://127.0.0.1:4174/health
    ProxyPassReverse /health http://127.0.0.1:4174/health

    Alias /.well-known/acme-challenge/ /var/www/saju-app/.well-known/acme-challenge/
    <Directory /var/www/saju-app/.well-known/acme-challenge/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://saju.blog%{REQUEST_URI} [R=301,END,NE]

    ErrorLog ${APACHE_LOG_DIR}/saju-blog-error.log
    CustomLog ${APACHE_LOG_DIR}/saju-blog-access.log combined
</VirtualHost>
