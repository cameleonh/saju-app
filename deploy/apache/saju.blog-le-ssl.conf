<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName saju.blog
    ServerAlias www.saju.blog
    DocumentRoot /var/www/saju-app

    <Directory /var/www/saju-app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.saju\.blog$ [NC]
    RewriteRule ^ https://saju.blog%{REQUEST_URI} [END,NE,R=301]

    ProxyPreserveHost On
    ProxyPass /v1/ http://127.0.0.1:4174/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:4174/v1/
    ProxyPass /health http://127.0.0.1:4174/health
    ProxyPassReverse /health http://127.0.0.1:4174/health
    ProxyPass / http://127.0.0.1:4174/
    ProxyPassReverse / http://127.0.0.1:4174/

    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=()"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/saju-blog-error.log
    LogFormat "%t \"%m %U %H\" %>s %b" saju_minimal
    CustomLog ${APACHE_LOG_DIR}/saju-blog-access.log saju_minimal

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/saju.blog/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/saju.blog/privkey.pem
</VirtualHost>
</IfModule>
